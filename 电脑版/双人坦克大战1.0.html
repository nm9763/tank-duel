<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>双人坦克大战 · Tank Duel</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 25%, #1c2340 0%, #080a12 72%);
    color: #e8edf7;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    position: relative;
    padding: 12px 12px 0;
    border-radius: 20px;
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.012));
    box-shadow: 0 30px 90px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08);
  }
  canvas {
    display: block;
    border-radius: 12px;
    background: #0b0f1b;
    max-width: 94vw;
    max-height: 76vh;
  }
  #foot {
    display: flex; gap: 26px; align-items: center; justify-content: center;
    padding: 10px 6px 12px;
    font-size: 13px; color: #8fa0c0; letter-spacing: .3px;
    flex-wrap: wrap;
  }
  .k {
    display: inline-block; min-width: 22px; text-align: center;
    padding: 2px 7px; margin: 0 3px;
    border-radius: 6px; font-size: 12px; font-weight: 700;
    background: linear-gradient(180deg,#39456b,#232c48);
    color: #dbe6ff;
    box-shadow: 0 2px 0 #141a2e, inset 0 1px 0 rgba(255,255,255,.12);
  }
  .p1 { color: #5fc8ff; font-weight: 700; }
  .p2 { color: #ff7a8a; font-weight: 700; }
  .sep { width: 1px; height: 18px; background: rgba(255,255,255,.14); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="640"></canvas>
  <div id="foot">
    <span><span class="p1">玩家 1</span> <span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span> 移动 · <span class="k">空格</span> 开火</span>
    <span class="sep"></span>
    <span><span class="p2">玩家 2</span> <span class="k">↑</span><span class="k">←</span><span class="k">↓</span><span class="k">→</span> 移动 · <span class="k">回车</span> 开火</span>
    <span class="sep"></span>
    <span><span class="k">R</span> 重开 · <span class="k">M</span> 音效开关</span>
  </div>
</div>

<script>
(function () {
'use strict';

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

var PAD = 14, TOP = 64;
var WIN_SCORE = 5;

/* ==================== 音效 ==================== */
var ac = null, soundOn = true;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f1, f2, dur, type, vol) {
  if (!soundOn || !ac) return;
  var t = ac.currentTime;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.connect(g); g.connect(ac.destination);
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.03);
}
var sfx = {
  shoot: function () { tone(560, 150, 0.08, 'square', 0.045); },
  hit:   function () { tone(320, 60, 0.15, 'sawtooth', 0.07); },
  boom:  function () { tone(170, 38, 0.5, 'sawtooth', 0.13); tone(90, 28, 0.65, 'triangle', 0.11); },
  pick:  function () { tone(640, 1250, 0.16, 'sine', 0.08); },
  count: function () { tone(720, 720, 0.07, 'sine', 0.05); },
  go:    function () { tone(520, 900, 0.18, 'sine', 0.09); },
  win:   function () { tone(520, 880, 0.2, 'sine', 0.09); setTimeout(function () { tone(780, 1350, 0.32, 'sine', 0.09); }, 150); }
};

/* ==================== 地图 ==================== */
var walls = [];
(function buildMap() {
  var left = [
    { x: 170, y: 110,    w: 26,  h: 180 },
    { x: 170, y: H - 290, w: 26, h: 180 },
    { x: 340, y: 220,    w: 110, h: 26 },
    { x: 340, y: H - 246, w: 110, h: 26 },
    { x: 120, y: H / 2 - 90, w: 26, h: 180 }
  ];
  for (var i = 0; i < left.length; i++) {
    var r = left[i];
    walls.push({ x: r.x, y: r.y, w: r.w, h: r.h });
    walls.push({ x: W - r.x - r.w, y: r.y, w: r.w, h: r.h });
  }
  walls.push({ x: W / 2 - 45, y: H / 2 - 45, w: 90, h: 90 });
})();

/* ==================== 工具 ==================== */
function pathRound(c, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function angDiff(a, b) {
  var d = (a - b) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function hitsWall(x, y, s) {
  var h = s / 2;
  for (var i = 0; i < walls.length; i++) {
    var w = walls[i];
    if (x + h > w.x && x - h < w.x + w.w && y + h > w.y && y - h < w.y + w.h) return true;
  }
  return false;
}

/* ==================== 状态 ==================== */
var state = 'countdown';
var stateTimer = 3;
var lastCount = 4;
var roundNum = 1;
var shake = 0;
var particles = [];
var texts = [];
var bullets = [];
var powerups = [];
var powerupTimer = 4;
var timeAcc = 0;

var keys = {};
var P1 = {
  name: '玩家 1', color: '#37b6ff', glow: '#8ddcff',
  spawnX: 96, spawnY: H / 2, sx: 'KeyW', sy: 'KeyS', lx: 'KeyA', rx: 'KeyD', shoot: ['Space'],
  x: 96, y: H / 2, size: 30, angle: 0, spawnAngle: 0,
  hp: 100, maxHp: 100, score: 0, cd: 0, baseCd: 0.34,
  rapid: 0, triple: 0, speedUp: 0, flash: 0, alive: true
};
var P2 = {
  name: '玩家 2', color: '#ff5568', glow: '#ffa8b4',
  spawnX: W - 96, spawnY: H / 2, sx: 'ArrowUp', sy: 'ArrowDown', lx: 'ArrowLeft', rx: 'ArrowRight', shoot: ['Enter', 'NumpadEnter'],
  x: W - 96, y: H / 2, size: 30, angle: Math.PI, spawnAngle: Math.PI,
  hp: 100, maxHp: 100, score: 0, cd: 0, baseCd: 0.34,
  rapid: 0, triple: 0, speedUp: 0, flash: 0, alive: true
};
var tanks = [P1, P2];

/* ==================== 特效 ==================== */
function spark(x, y, color, n, power) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = (40 + Math.random() * 190) * (power || 1);
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.4, max: 0.8, r: 1.6 + Math.random() * 3, color: color });
  }
}
function explode(x, y, color) {
  for (var i = 0; i < 46; i++) {
    var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 320;
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.7, max: 1.2, r: 2 + Math.random() * 4.5, color: Math.random() < 0.5 ? color : '#ffcf6b' });
  }
  shake = 16;
}
function floatText(x, y, text, color) { texts.push({ x: x, y: y, text: text, color: color, life: 1.1, max: 1.1 }); }

/* ==================== 开火 ==================== */
function fire(t) {
  if (t.cd > 0) return;
  t.cd = t.rapid > 0 ? t.baseCd * 0.42 : t.baseCd;
  var spread = t.triple > 0 ? [-0.17, 0, 0.17] : [0];
  var mx = t.x + Math.cos(t.angle) * (t.size * 0.5 + 12);
  var my = t.y + Math.sin(t.angle) * (t.size * 0.5 + 12);
  for (var i = 0; i < spread.length; i++) {
    var a = t.angle + spread[i], sp = 580;
    bullets.push({ x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 5, owner: t, color: t.color, trail: [] });
  }
  spark(mx, my, t.glow, 5, 0.6);
  shake = Math.max(shake, 2);
  sfx.shoot();
}

/* ==================== 伤害 ==================== */
function damage(t, dmg) {
  if (!t.alive) return;
  t.hp -= dmg;
  t.flash = 0.2;
  shake = Math.max(shake, 7);
  sfx.hit();
  floatText(t.x, t.y - t.size, '-' + dmg, '#ffd36b');
  if (t.hp <= 0) {
    t.hp = 0;
    t.alive = false;
    explode(t.x, t.y, t.color);
    sfx.boom();
    var other = t === P1 ? P2 : P1;
    other.score++;
    if (other.score >= WIN_SCORE) {
      state = 'matchover'; stateTimer = 0; sfx.win();
    } else {
      state = 'roundover'; stateTimer = 2.0;
    }
  }
}

/* ==================== 道具 ==================== */
var PU_TYPES = {
  heal:  { color: '#4fe08a', sym: '+' },
  rapid: { color: '#ffb648', sym: '»' },
  triple:{ color: '#c07bff', sym: '≡' },
  speed: { color: '#59e6ff', sym: '^' }
};
var puKeys = Object.keys(PU_TYPES);

function spawnPowerup() {
  for (var i = 0; i < 60; i++) {
    var x = PAD + 60 + Math.random() * (W - PAD * 2 - 120);
    var y = TOP + 40 + Math.random() * (H - TOP - PAD - 80);
    if (hitsWall(x, y, 44)) continue;
    var tooClose = false;
    for (var j = 0; j < tanks.length; j++) {
      if (Math.hypot(tanks[j].x - x, tanks[j].y - y) < 110) { tooClose = true; break; }
    }
    if (tooClose) continue;
    var type = puKeys[(Math.random() * puKeys.length) | 0];
    powerups.push({ x: x, y: y, r: 16, type: type, t: Math.random() * 6 });
    return;
  }
}
function applyPowerup(t, p) {
  var d = PU_TYPES[p.type];
  if (p.type === 'heal') { t.hp = Math.min(t.maxHp, t.hp + 40); floatText(t.x, t.y - t.size, '+40 HP', d.color); }
  else if (p.type === 'rapid') { t.rapid = 8; floatText(t.x, t.y - t.size, '连射!', d.color); }
  else if (p.type === 'triple') { t.triple = 8; floatText(t.x, t.y - t.size, '散射!', d.color); }
  else if (p.type === 'speed') { t.speedUp = 8; floatText(t.x, t.y - t.size, '加速!', d.color); }
  spark(p.x, p.y, d.color, 18, 1);
  sfx.pick();
}

/* ==================== 回合 ==================== */
function resetRound() {
  for (var i = 0; i < tanks.length; i++) {
    var t = tanks[i];
    t.x = t.spawnX; t.y = t.spawnY; t.angle = t.spawnAngle;
    t.hp = t.maxHp; t.cd = 0; t.rapid = 0; t.triple = 0;
    t.speedUp = 0; t.flash = 0; t.alive = true;
  }
  bullets.length = 0; particles.length = 0; powerups.length = 0; texts.length = 0;
  powerupTimer = 4; shake = 0;
  state = 'countdown'; stateTimer = 3; lastCount = 4;
}
function resetMatch() {
  P1.score = 0; P2.score = 0; roundNum = 1;
  resetRound();
}

/* ==================== 更新 ==================== */
function update(dt) {
  // 粒子 / 文字
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - dt * 2.2); p.vy *= (1 - dt * 2.2);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (var i2 = texts.length - 1; i2 >= 0; i2--) {
    var tx = texts[i2];
    tx.y -= dt * 34; tx.life -= dt;
    if (tx.life <= 0) texts.splice(i2, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 46);

  // 倒计时
  if (state === 'countdown') {
    stateTimer -= dt;
    var n = Math.ceil(stateTimer);
    if (n !== lastCount) { lastCount = n; if (n > 0) sfx.count(); else sfx.go(); }
    if (stateTimer <= 0) { state = 'playing'; }
    return;
  }
  if (state === 'roundover') {
    stateTimer -= dt;
    if (stateTimer <= 0) { roundNum++; resetRound(); }
    return;
  }
  if (state === 'matchover') return;

  /* ---- 正常战斗 ---- */
  timeAcc += dt;

  for (var k = 0; k < tanks.length; k++) {
    var t = tanks[k];
    if (t.flash > 0) t.flash -= dt;
    if (t.cd > 0) t.cd -= dt;
    if (t.rapid > 0) t.rapid -= dt;
    if (t.triple > 0) t.triple -= dt;
    if (t.speedUp > 0) t.speedUp -= dt;

    var dx = 0, dy = 0;
    if (keys[t.lx]) dx -= 1;
    if (keys[t.rx]) dx += 1;
    if (keys[t.sx]) dy -= 1;
    if (keys[t.sy]) dy += 1;
    if (dx || dy) {
      var len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      t.angle += angDiff(Math.atan2(dy, dx), t.angle) * Math.min(1, dt * 20);
      var sp = 200 * (t.speedUp > 0 ? 1.55 : 1);
      var nx = t.x + dx * sp * dt;
      var ny = t.y + dy * sp * dt;
      var h = t.size / 2;
      if (!hitsWall(nx, t.y, t.size)) t.x = clamp(nx, PAD + h, W - PAD - h);
      if (!hitsWall(t.x, ny, t.size)) t.y = clamp(ny, TOP + h, H - PAD - h);
    }

    var shootHeld = false;
    for (var s = 0; s < t.shoot.length; s++) if (keys[t.shoot[s]]) shootHeld = true;
    if (shootHeld) fire(t);
  }

  // 子弹
  var bi = bullets.length;
  while (bi--) {
    var bu = bullets[bi];
    bu.trail.push({ x: bu.x, y: bu.y });
    if (bu.trail.length > 7) bu.trail.shift();
    bu.x += bu.vx * dt; bu.y += bu.vy * dt;

    // 出界
    if (bu.x < PAD || bu.x > W - PAD || bu.y < TOP || bu.y > H - PAD) { bullets.splice(bi, 1); continue; }

    // 撞墙
    var hitW = false;
    for (var wi = 0; wi < walls.length; wi++) {
      var w2 = walls[wi];
      if (bu.x > w2.x - bu.r && bu.x < w2.x + w2.w + bu.r && bu.y > w2.y - bu.r && bu.y < w2.y + w2.h + bu.r) { hitW = true; break; }
    }
    if (hitW) { spark(bu.x, bu.y, '#9fb4dd', 6, 0.7); bullets.splice(bi, 1); continue; }

    // 命中坦克
    var hitTank = null;
    for (var ti = 0; ti < tanks.length; ti++) {
      var tk = tanks[ti];
      if (tk === bu.owner || !tk.alive) continue;
      if (Math.hypot(tk.x - bu.x, tk.y - bu.y) < tk.size * 0.55 + bu.r) { hitTank = tk; break; }
    }
    if (hitTank) {
      spark(bu.x, bu.y, hitTank.glow, 12, 1);
      damage(hitTank, 20);
      bullets.splice(bi, 1);
      continue;
    }

    // 子弹互撞（同归于尽）
    var cancelIdx = -1;
    for (var o = bi - 1; o >= 0; o--) {
      var b2 = bullets[o];
      if (b2.owner === bu.owner) continue;
      if (Math.hypot(b2.x - bu.x, b2.y - bu.y) < b2.r + bu.r + 2) { cancelIdx = o; break; }
    }
    if (cancelIdx >= 0) {
      var b2c = bullets[cancelIdx];
      spark((b2c.x + bu.x) / 2, (b2c.y + bu.y) / 2, '#ffe08a', 12, 1.2);
      bullets.splice(bi, 1);
      bullets.splice(cancelIdx, 1);
      // 一次删掉两颗，索引会错位，重置后从末尾继续
      bi = bullets.length;
    }
  }

  // 道具生成与拾取
  powerupTimer -= dt;
  if (powerupTimer <= 0 && powerups.length < 2) { spawnPowerup(); powerupTimer = 6.5; }
  for (var pi = powerups.length - 1; pi >= 0; pi--) {
    var pu = powerups[pi];
    pu.t += dt;
    for (var q = 0; q < tanks.length; q++) {
      var tt = tanks[q];
      if (tt.alive && Math.hypot(tt.x - pu.x, tt.y - pu.y) < tt.size * 0.6 + pu.r) {
        applyPowerup(tt, pu);
        powerups.splice(pi, 1);
        break;
      }
    }
  }
}

/* ==================== 绘制 ==================== */
function drawBackground() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#111731');
  g.addColorStop(1, '#0a0e1c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(90,130,220,.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = PAD; x <= W - PAD; x += 40) { ctx.moveTo(x, TOP); ctx.lineTo(x, H - PAD); }
  for (var y = TOP; y <= H - PAD; y += 40) { ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); }
  ctx.stroke();

  // 场地边框
  ctx.strokeStyle = 'rgba(110,160,255,.28)';
  ctx.lineWidth = 2;
  pathRound(ctx, PAD - 4, TOP - 4, W - PAD * 2 + 8, H - TOP - PAD + 8, 10);
  ctx.stroke();
}

function drawWalls() {
  for (var i = 0; i < walls.length; i++) {
    var w = walls[i];
    var g = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
    g.addColorStop(0, '#3d4a6e');
    g.addColorStop(1, '#232b44');
    pathRound(ctx, w.x, w.y, w.w, w.h, 5);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(150,185,255,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    pathRound(ctx, w.x + 3, w.y + 3, w.w - 6, Math.min(6, w.h - 6), 3);
    ctx.fillStyle = 'rgba(190,215,255,.16)'; ctx.fill();
  }
}

function drawPowerups() {
  for (var i = 0; i < powerups.length; i++) {
    var p = powerups[i], d = PU_TYPES[p.type];
    var bob = Math.sin(p.t * 3) * 3;
    var y = p.y + bob;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var rg = ctx.createRadialGradient(p.x, y, 2, p.x, y, p.r * 2.4);
    rg.addColorStop(0, d.color); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(p.x, y, p.r * 2.4, 0, 7); ctx.fillStyle = rg; ctx.fill();
    ctx.restore();

    ctx.beginPath(); ctx.arc(p.x, y, p.r, 0, 7);
    ctx.fillStyle = 'rgba(10,14,26,.92)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = d.color; ctx.stroke();

    ctx.fillStyle = d.color;
    ctx.font = 'bold 19px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d.sym, p.x, y + 1);
  }
}

function drawBullets() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    if (b.trail.length > 1) {
      for (var j = 1; j < b.trail.length; j++) {
        ctx.globalAlpha = (j / b.trail.length) * 0.4;
        ctx.strokeStyle = b.color;
        ctx.lineWidth = (j / b.trail.length) * b.r * 1.6;
        ctx.beginPath();
        ctx.moveTo(b.trail[j - 1].x, b.trail[j - 1].y);
        ctx.lineTo(b.trail[j].x, b.trail[j].y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    var rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3.2);
    rg.addColorStop(0, '#ffffff');
    rg.addColorStop(0.35, b.color);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 3.2, 0, 7); ctx.fillStyle = rg; ctx.fill();
  }
  ctx.restore();
}

function drawTank(t) {
  var s = t.size;
  ctx.save();
  ctx.translate(t.x, t.y);

  // 地面阴影
  ctx.globalAlpha = 0.35;
  ctx.beginPath(); ctx.ellipse(3, 4, s * 0.62, s * 0.5, 0, 0, 7);
  ctx.fillStyle = '#000'; ctx.fill();
  ctx.globalAlpha = 1;

  ctx.rotate(t.angle);

  // 炮管
  ctx.fillStyle = '#1a2035';
  pathRound(ctx, s * 0.2, -5, s * 0.85, 10, 3); ctx.fill();
  ctx.fillStyle = t.color;
  pathRound(ctx, s * 0.2, -3, s * 0.85, 6, 3); ctx.fill();

  // 履带
  ctx.fillStyle = '#151a2b';
  pathRound(ctx, -s * 0.54, -s * 0.54, s * 1.08, s * 0.2, 3); ctx.fill();
  pathRound(ctx, -s * 0.54, s * 0.34, s * 1.08, s * 0.2, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.lineWidth = 1; ctx.stroke();

  // 车身
  var g = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
  g.addColorStop(0, t.glow);
  g.addColorStop(0.5, t.color);
  g.addColorStop(1, t.color);
  pathRound(ctx, -s / 2, -s / 2, s, s, 8);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();

  // 炮塔
  ctx.beginPath(); ctx.arc(0, 0, s * 0.27, 0, 7);
  ctx.fillStyle = 'rgba(15,20,35,.75)'; ctx.fill();
  ctx.strokeStyle = t.glow; ctx.lineWidth = 2; ctx.stroke();

  // 受击闪白
  if (t.flash > 0) {
    ctx.globalAlpha = Math.min(0.85, t.flash * 4);
    pathRound(ctx, -s / 2, -s / 2, s, s, 8);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // 状态光环
  if (t.speedUp > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 + Math.sin(performance.now() / 80) * 0.2;
    ctx.beginPath(); ctx.arc(t.x, t.y, s * 0.95, 0, 7);
    ctx.strokeStyle = '#59e6ff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
  if (t.rapid > 0 || t.triple > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.45 + Math.sin(performance.now() / 90) * 0.2;
    ctx.beginPath(); ctx.arc(t.x, t.y, s * 0.85, 0, 7);
    ctx.strokeStyle = t.triple > 0 ? '#c07bff' : '#ffb648'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  // 头顶血条
  var bw = 44, bh = 6, bx = t.x - bw / 2, by = t.y - s * 0.5 - 15;
  ctx.fillStyle = 'rgba(0,0,0,.65)';
  pathRound(ctx, bx - 1, by - 1, bw + 2, bh + 2, 3); ctx.fill();
  var ratio = t.hp / t.maxHp;
  ctx.fillStyle = ratio > 0.5 ? '#4fe08a' : (ratio > 0.25 ? '#ffb648' : '#ff4d5e');
  pathRound(ctx, bx, by, bw * ratio, bh, 3); ctx.fill();
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
    ctx.fillStyle = p.color; ctx.fill();
  }
  ctx.restore();
}

function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i = 0; i < texts.length; i++) {
    var t = texts[i];
    ctx.globalAlpha = Math.max(0, t.life / t.max);
    ctx.font = 'bold 18px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
    ctx.globalAlpha = 1;
  }
}

function drawHud() {
  ctx.fillStyle = 'rgba(6,9,18,.78)';
  ctx.fillRect(0, 0, W, TOP - 4);
  ctx.strokeStyle = 'rgba(120,160,255,.18)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, TOP - 4); ctx.lineTo(W, TOP - 4); ctx.stroke();

  drawPlayerHud(P1, false);
  drawPlayerHud(P2, true);

  // 中央
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#dfe8ff';
  ctx.font = 'bold 20px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillText('第 ' + roundNum + ' 局', W / 2, 22);
  ctx.fillStyle = '#7f90b3';
  ctx.font = '12px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillText('先得 ' + WIN_SCORE + ' 分获胜', W / 2, 44);
}

function drawPlayerHud(t, right) {
  var bw = 300, bh = 16;
  var bx = right ? W - 24 - bw : 24;
  var by = 32;
  var ratio = t.hp / t.maxHp;

  ctx.textAlign = right ? 'right' : 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = t.color;
  ctx.font = 'bold 16px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillText(t.name, right ? W - 24 : 24, 18);

  // 血条底
  pathRound(ctx, bx, by, bw, bh, 8);
  ctx.fillStyle = 'rgba(255,255,255,.09)'; ctx.fill();

  // 血条
  if (ratio > 0) {
    var g = ctx.createLinearGradient(bx, by, bx + bw * ratio, by);
    g.addColorStop(0, t.glow);
    g.addColorStop(1, t.color);
    pathRound(ctx, bx, by, Math.max(4, bw * ratio), bh, 8);
    ctx.fillStyle = g; ctx.fill();
  }
  pathRound(ctx, bx, by, bw, bh, 8);
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.stroke();

  // 分数点
  var pipX = right ? W - 24 - bw - 150 : 24 + bw + 12;
  for (var i = 0; i < WIN_SCORE; i++) {
    var px = right ? (W - 24 - bw - 12 - (i + 1) * 18) : (24 + bw + 12 + i * 18);
    ctx.beginPath();
    ctx.arc(px + 6, 40, 6, 0, 7);
    if (i < t.score) { ctx.fillStyle = t.color; ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.stroke(); }
  }

  // 状态图标
  var icons = [];
  if (t.rapid > 0) icons.push({ c: '#ffb648', s: '连射 ' + t.rapid.toFixed(1) });
  if (t.triple > 0) icons.push({ c: '#c07bff', s: '散射 ' + t.triple.toFixed(1) });
  if (t.speedUp > 0) icons.push({ c: '#59e6ff', s: '加速 ' + t.speedUp.toFixed(1) });
  var ix = right ? W - 24 : 24;
  ctx.font = 'bold 11px "Segoe UI", "Microsoft YaHei", sans-serif';
  for (var k = 0; k < icons.length; k++) {
    var label = icons[k].s;
    var tw = ctx.measureText(label).width + 14;
    var rx = right ? ix - tw : ix;
    pathRound(ctx, rx, 52, tw, 15, 7);
    ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fill();
    ctx.fillStyle = icons[k].c;
    ctx.textAlign = 'center';
    ctx.fillText(label, rx + tw / 2, 60);
    ix += right ? -tw - 6 : tw + 6;
  }
}

function drawOverlay() {
  if (state === 'playing') return;
  if (state === 'matchover') {
    ctx.fillStyle = 'rgba(4,6,14,.78)';
    ctx.fillRect(0, 0, W, H);
    var win = P1.score >= WIN_SCORE ? P1 : P2;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.save();
    ctx.shadowColor = win.color; ctx.shadowBlur = 40;
    ctx.fillStyle = win.glow;
    ctx.font = 'bold 62px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(win.name + ' 获胜!', W / 2, H / 2 - 40);
    ctx.restore();
    ctx.fillStyle = '#cfdcff';
    ctx.font = 'bold 28px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(P1.score + ' : ' + P2.score, W / 2, H / 2 + 30);
    ctx.fillStyle = '#8fa0c0';
    ctx.font = '18px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText('按 R 键再来一局', W / 2, H / 2 + 86);
    return;
  }
  if (state === 'countdown') {
    var n = Math.ceil(stateTimer);
    var frac = 1 - (stateTimer - Math.floor(stateTimer));
    var show = n > 0 ? String(n) : '开始!';
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = Math.max(0, Math.min(1, frac * 1.6));
    var sc = 1 + (1 - frac) * 0.6;
    ctx.translate(W / 2, H / 2);
    ctx.scale(sc, sc);
    ctx.shadowColor = '#6ea8ff'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#eaf2ff';
    ctx.font = 'bold 96px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(show, 0, 0);
    ctx.restore();
    return;
  }
  if (state === 'roundover') {
    ctx.fillStyle = 'rgba(4,6,14,.55)';
    ctx.fillRect(0, 0, W, H);
    var scorer = P1.score > P2.score ? P1 : P2;
    // 找出本局得分者
    for (var i = 0; i < tanks.length; i++) if (!tanks[i].alive) scorer = tanks[i] === P1 ? P2 : P1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = scorer.glow;
    ctx.font = 'bold 46px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(scorer.name + ' 得分!', W / 2, H / 2);
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawWalls();
  drawPowerups();
  drawBullets();
  for (var i = 0; i < tanks.length; i++) if (tanks[i].alive) drawTank(tanks[i]);
  drawParticles();
  drawTexts();

  ctx.restore();

  drawHud();
  drawOverlay();
}

/* ==================== 输入 ==================== */
window.addEventListener('keydown', function (e) {
  var c = e.code;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter'].indexOf(c) >= 0) e.preventDefault();
  initAudio();
  keys[c] = true;
  if (c === 'KeyM') { soundOn = !soundOn; }
  if (c === 'KeyR') {
    if (state === 'matchover') resetMatch();
    else resetRound();
  }
}, { passive: false });

window.addEventListener('keyup', function (e) { keys[e.code] = false; });
window.addEventListener('blur', function () { keys = {}; });
window.addEventListener('mousedown', initAudio);

/* ==================== 主循环 ==================== */
var last = performance.now();
function loop(now) {
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
