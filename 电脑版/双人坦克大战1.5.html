<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>双人坦克大战 · 多地图版</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 25%, #1c2340 0%, #080a12 72%);
    color: #e8edf7;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    position: relative;
    padding: 12px 12px 0;
    border-radius: 20px;
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.012));
    box-shadow: 0 30px 90px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08);
  }
  canvas {
    display: block;
    border-radius: 12px;
    background: #0b0f1b;
    max-width: 94vw;
    max-height: 76vh;
  }
  #foot {
    display: flex; gap: 26px; align-items: center; justify-content: center;
    padding: 10px 6px 12px;
    font-size: 13px; color: #8fa0c0; letter-spacing: .3px;
    flex-wrap: wrap;
  }
  .k {
    display: inline-block; min-width: 22px; text-align: center;
    padding: 2px 7px; margin: 0 3px;
    border-radius: 6px; font-size: 12px; font-weight: 700;
    background: linear-gradient(180deg,#39456b,#232c48);
    color: #dbe6ff;
    box-shadow: 0 2px 0 #141a2e, inset 0 1px 0 rgba(255,255,255,.12);
  }
  .p1 { color: #5fc8ff; font-weight: 700; }
  .p2 { color: #ff7a8a; font-weight: 700; }
  .sep { width: 1px; height: 18px; background: rgba(255,255,255,.14); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="640"></canvas>
  <div id="foot">
    <span><span class="p1">玩家 1</span> <span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span>移动 · <span class="k">空格</span>开火 · <span class="k">Q</span>放地雷</span>
    <span class="sep"></span>
    <span id="p2hint"><span class="p2">玩家 2</span> <span class="k">↑</span><span class="k">←</span><span class="k">↓</span><span class="k">→</span>移动 · <span class="k">回车</span>开火 · <span class="k">/</span>放地雷</span>
    <span class="sep"></span>
    <span><span class="k">R</span>重开 · <span class="k">← Backspace</span>选地图 · <span class="k">M</span>音效</span>
  </div>
</div>
<script>
(function () {
'use strict';
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var PAD = 14, TOP = 64;
var WIN_SCORE = 5;

/* ==================== 音效 ==================== */
var ac = null, soundOn = true;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f1, f2, dur, type, vol) {
  if (!soundOn || !ac) return;
  var t = ac.currentTime;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.connect(g); g.connect(ac.destination);
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur + 0.03);
}
var sfx = {
  shoot: function () { tone(560, 150, 0.08, 'square', 0.045); },
  hit:   function () { tone(320, 60, 0.15, 'sawtooth', 0.07); },
  boom:  function () { tone(170, 38, 0.5, 'sawtooth', 0.13); tone(90, 28, 0.65, 'triangle', 0.11); },
  pick:  function () { tone(640, 1250, 0.16, 'sine', 0.08); },
  count: function () { tone(720, 720, 0.07, 'sine', 0.05); },
  go:    function () { tone(520, 900, 0.18, 'sine', 0.09); },
  win:   function () { tone(520, 880, 0.2, 'sine', 0.09); setTimeout(function () { tone(780, 1350, 0.32, 'sine', 0.09); }, 150); },
  freeze:function(){tone(220,440,0.22,'sine',0.06);},
  mine:  function(){tone(130,40,0.4,'sawtooth',0.1);},
  select:function(){tone(620,820,0.1,'sine',0.06);},
  confirm:function(){tone(520,960,0.18,'sine',0.09);}
};

/* ==================== 4张地图配置 ==================== */
var maps = [
  { name: "经典对称", desc: "标准攻防布局 · 左右均衡", build: buildMapClassic },
  { name: "回廊纵横", desc: "横向长通道 · 快速拉扯战", build: buildMapCorridor },
  { name: "环形要塞", desc: "中心堡垒 · 四面埋伏", build: buildMapFortress },
  { name: "四分战场", desc: "十字分割 · 拐角巷战", build: buildMapQuad }
];
var currentMap = 0;
var walls = [];

// 四周边界墙：四张地图共用，紧贴活动区外侧，不占用坦克活动范围
function addBorder(w) {
  w.push({ x: 0, y: TOP - PAD, w: W, h: PAD });                   // 上边界
  w.push({ x: 0, y: H - PAD, w: W, h: PAD });                     // 下边界
  w.push({ x: 0, y: TOP - PAD, w: PAD, h: H - TOP + PAD });       // 左边界
  w.push({ x: W - PAD, y: TOP - PAD, w: PAD, h: H - TOP + PAD }); // 右边界
  return w;
}

// 地图1：经典对称
function buildMapClassic() {
  var w = [];
  var left = [
    { x: 170, y: 110,    w: 26,  h: 180 },
    { x: 170, y: H - 290, w: 26, h: 180 },
    { x: 340, y: 220,    w: 110, h: 26 },
    { x: 340, y: H - 246, w: 110, h: 26 },
    { x: 120, y: H / 2 - 90, w: 26, h: 180 }
  ];
  for (var i = 0; i < left.length; i++) {
    var r = left[i];
    w.push({ x: r.x, y: r.y, w: r.w, h: r.h });
    w.push({ x: W - r.x - r.w, y: r.y, w: r.w, h: r.h });
  }
  w.push({ x: W / 2 - 45, y: H / 2 - 45, w: 90, h: 90 });
  return addBorder(w);
}

// 地图2：回廊纵横
function buildMapCorridor() {
  var w = [];
  w.push({ x: 80, y: 160, w: 340, h: 22 });
  w.push({ x: W - 80 - 340, y: 160, w: 340, h: 22 });
  w.push({ x: 180, y: H/2 - 11, w: 260, h: 22 });
  w.push({ x: W - 180 - 260, y: H/2 - 11, w: 260, h: 22 });
  w.push({ x: 80, y: H - 182, w: 340, h: 22 });
  w.push({ x: W - 80 - 340, y: H - 182, w: 340, h: 22 });
  w.push({ x: 40, y: 260, w: 22, h: 120 });
  w.push({ x: W - 62, y: 260, w: 22, h: 120 });
  w.push({ x: 40, y: H - 380, w: 22, h: 120 });
  w.push({ x: W - 62, y: H - 380, w: 22, h: 120 });
  return addBorder(w);
}

// 地图3：环形要塞
function buildMapFortress() {
  var w = [];
  var cx = W/2, cy = H/2, size = 170;
  w.push({ x: cx - size/2, y: cy - size/2, w: size, h: 26 });
  w.push({ x: cx - size/2, y: cy + size/2 - 26, w: size, h: 26 });
  w.push({ x: cx - size/2, y: cy - size/2 + 26, w: 26, h: 50 });
  w.push({ x: cx - size/2, y: cy + size/2 - 76, w: 26, h: 50 });
  w.push({ x: cx + size/2 - 26, y: cy - size/2 + 26, w: 26, h: 50 });
  w.push({ x: cx + size/2 - 26, y: cy + size/2 - 76, w: 26, h: 50 });
  w.push({ x: 120, y: 120, w: 80, h: 26 });
  w.push({ x: W - 200, y: 120, w: 80, h: 26 });
  w.push({ x: 120, y: H - 146, w: 80, h: 26 });
  w.push({ x: W - 200, y: H - 146, w: 80, h: 26 });
  w.push({ x: 200, y: H/2 - 13, w: 26, h: 26 });
  w.push({ x: W - 226, y: H/2 - 13, w: 26, h: 26 });
  return addBorder(w);
}

// 地图4：四分战场
function buildMapQuad() {
  var w = [];
  w.push({ x: W/2 - 13, y: TOP + 30, w: 26, h: 180 });
  w.push({ x: W/2 - 13, y: H - PAD - 210, w: 26, h: 180 });
  w.push({ x: 150, y: H/2 - 13, w: 120, h: 26 });
  w.push({ x: W - 270, y: H/2 - 13, w: 120, h: 26 });
  w.push({ x: 100, y: 120, w: 26, h: 90 });
  w.push({ x: 190, y: 120, w: 90, h: 26 });
  w.push({ x: W - 280, y: 120, w: 90, h: 26 });
  w.push({ x: W - 126, y: 120, w: 26, h: 90 });
  w.push({ x: 100, y: H - 210, w: 26, h: 90 });
  w.push({ x: 190, y: H - 146, w: 90, h: 26 });
  w.push({ x: W - 280, y: H - 146, w: 90, h: 26 });
  w.push({ x: W - 126, y: H - 210, w: 26, h: 90 });
  return addBorder(w);
}

function loadMap(index) {
  walls = maps[index].build();
}

/* ==================== 工具函数 ==================== */
function pathRound(c, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function angDiff(a, b) {
  var d = (a - b) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function hitsWall(x, y, s) {
  var h = s / 2;
  for (var i = 0; i < walls.length; i++) {
    var w = walls[i];
    if (x + h > w.x && x - h < w.x + w.w && y + h > w.y && y - h < w.y + w.h) return true;
  }
  return false;
}

/* ==================== 对战模式 ==================== */
var modes = [
  { id: 2, name: '双人对战', desc: '同屏双人 · 键盘对拼', icon: '👥' },
  { id: 1, name: '单人模式', desc: '人机对战 · 电脑很强', icon: '🤖' }
];
var currentMode = 0;
var gameMode = 2;

/* ==================== 游戏状态 ==================== */
var state = 'modeselect';
var stateTimer = 3;
var lastCount = 4;
var roundNum = 1;
var shake = 0;
var particles = [];
var texts = [];
var bullets = [];
var powerups = [];
var mines = [];
var powerupTimer = 4;
var timeAcc = 0;
var keys = {};

var P1 = {
  name: '玩家 1', color: '#37b6ff', glow: '#8ddcff',
  spawnX: 96, spawnY: H / 2, sx: 'KeyW', sy: 'KeyS', lx: 'KeyA', rx: 'KeyD', shoot: ['Space'], mineKey:'KeyQ',
  x: 96, y: H / 2, size: 30, angle: 0, spawnAngle: 0,
  hp: 100, maxHp: 100, score: 0, cd: 0, baseCd: 0.34,
  rapid: 0, triple: 0, speedUp: 0, flash: 0, alive: true,
  shield:0, ricochet:0, ap:0, frozen:0, mineCd:0, mineAmmo:0
};
var P2 = {
  name: '玩家 2', color: '#ff5568', glow: '#ffa8b4', ai: false,
  spawnX: W - 96, spawnY: H / 2, sx: 'ArrowUp', sy: 'ArrowDown', lx: 'ArrowLeft', rx: 'ArrowRight', shoot: ['Enter', 'NumpadEnter'], mineKey:'Slash',
  x: W - 96, y: H / 2, size: 30, angle: Math.PI, spawnAngle: Math.PI,
  hp: 100, maxHp: 100, score: 0, cd: 0, baseCd: 0.34,
  rapid: 0, triple: 0, speedUp: 0, flash: 0, alive: true,
  shield:0, ricochet:0, ap:0, frozen:0, mineCd:0, mineAmmo:0
};
var tanks = [P1, P2];

var PU_TYPES = {
  heal:  { color: '#4fe08a', sym: '+' },
  rapid: { color: '#ffb648', sym: '»' },
  triple:{ color: '#c07bff', sym: '≡' },
  speed: { color: '#59e6ff', sym: '^' },
  shield:{ color:'#4298ff', sym:'🛡' },
  ricochet:{color:'#ffdd22',sym:'🔄'},
  ap:{color:'#ff3c28',sym:'💥'},
  freeze:{color:'#80e8ff',sym:'❄'},
  minepack:{color:'#9467bd',sym:'💣'}
};
var puKeys = Object.keys(PU_TYPES);

/* ==================== 特效 ==================== */
function spark(x, y, color, n, power) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = (40 + Math.random() * 190) * (power || 1);
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.4, max: 0.8, r: 1.6 + Math.random() * 3, color: color });
  }
}
function explode(x, y, color) {
  for (var i = 0; i < 46; i++) {
    var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 320;
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.7, max: 1.2, r: 2 + Math.random() * 4.5, color: Math.random() < 0.5 ? color : '#ffcf6b' });
  }
  shake = 16;
}
function floatText(x, y, text, color) { texts.push({ x: x, y: y, text: text, color: color, life: 1.1, max: 1.1 }); }

/* ==================== 开火 & 地雷 ==================== */
function fire(t) {
  if (t.cd > 0) return;
  t.cd = t.rapid > 0 ? t.baseCd * 0.42 : t.baseCd;
  var spread = t.triple > 0 ? [-0.17, 0, 0.17] : [0];
  // 削弱散射：触发散射时单发伤害降为 15
  var dmg = t.triple > 0 ? 15 : (t.ap > 0 ? 40 : 20);
  var mx = t.x + Math.cos(t.angle) * (t.size * 0.5 + 12);
  var my = t.y + Math.sin(t.angle) * (t.size * 0.5 + 12);
  for (var i = 0; i < spread.length; i++) {
    var a = t.angle + spread[i], sp = 580;
    bullets.push({
      x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: 5, owner: t, color: t.color, trail: [],
      ricochet: t.ricochet>0 ? 2 : 0,
      dmg: dmg
    });
  }
  spark(mx, my, t.glow, 5, 0.6);
  shake = Math.max(shake, 2);
  sfx.shoot();
}

function layMine(t){
  if(t.mineCd>0) return;
  if(t.mineAmmo<=0){ floatText(t.x,t.y-30,"没有地雷","#8c96ad"); return; }
  t.mineAmmo--;
  t.mineCd=2.2;
  mines.push({x:t.x,y:t.y,owner:t,r:18,armed:false,armTimer:0.8});
  floatText(t.x,t.y-30,"放置地雷","#bb90dd");
}

/* ==================== 伤害 ==================== */
function damage(t, dmg) {
  if (!t.alive) return;
  if(t.shield>0){
    t.shield = 0; // 护盾格挡一次攻击后消耗
    floatText(t.x, t.y - t.size, '护盾格挡!', '#4298ff');
    spark(t.x,t.y,"#4298ff",16,1);
    shake = Math.max(shake, 4);
    return;
  }
  t.hp -= dmg;
  t.flash = 0.2;
  shake = Math.max(shake, 7);
  sfx.hit();
  floatText(t.x, t.y - t.size, '-' + dmg, '#ffd36b');
  if (t.hp <= 0) {
    t.hp = 0;
    t.alive = false;
    explode(t.x, t.y, t.color);
    sfx.boom();
    var other = t === P1 ? P2 : P1;
    other.score++;
    if (other.score >= WIN_SCORE) {
      state = 'matchover'; stateTimer = 0; sfx.win();
    } else {
      state = 'roundover'; stateTimer = 2.0;
    }
  }
}

/* ==================== 道具拾取 ==================== */
function applyPowerup(t, p) {
  var d = PU_TYPES[p.type];
  if (p.type === 'heal') { t.hp = Math.min(t.maxHp, t.hp + 40); floatText(t.x, t.y - t.size, '+40 HP', d.color); }
  else if (p.type === 'rapid') { t.rapid = 8; floatText(t.x, t.y - t.size, '连射!', d.color); }
  else if (p.type === 'triple') { t.triple = 8; floatText(t.x, t.y - t.size, '散射!', d.color); }
  else if (p.type === 'speed') { t.speedUp = 8; floatText(t.x, t.y - t.size, '加速!', d.color); }
  else if(p.type==='shield'){ t.shield=1; floatText(t.x,t.y-t.size,"🛡护盾(挡1次)",d.color); }
  else if(p.type==='ricochet'){ t.ricochet=7; floatText(t.x,t.y-t.size,"🔄反弹子弹",d.color); }
  else if(p.type==='ap'){ t.ap=7; floatText(t.x,t.y-t.size,"💥穿甲弹",d.color); }
  else if(p.type==='freeze'){
    var enemy = t===P1?P2:P1;
    enemy.frozen=2.0;
    floatText(t.x,t.y-t.size,"❄冻结对手!",d.color);
    sfx.freeze();
  }
  else if(p.type==='minepack'){
    t.mineAmmo += 3;
    floatText(t.x,t.y-t.size,"💣地雷 x"+t.mineAmmo,d.color);
  }
  spark(p.x, p.y, d.color, 18, 1);
  sfx.pick();
}

/* ==================== 回合重置 ==================== */
function resetRound() {
  for (var i = 0; i < tanks.length; i++) {
    var t = tanks[i];
    t.x = t.spawnX; t.y = t.spawnY; t.angle = t.spawnAngle;
    t.hp = t.maxHp; t.cd = 0; t.rapid = 0; t.triple = 0;
    t.speedUp = 0; t.flash = 0; t.alive = true;
    t.shield=0; t.ricochet=0; t.ap=0; t.frozen=0; t.mineCd=0; t.mineAmmo=0;
  }
  bullets.length = 0; particles.length = 0; powerups.length = 0; texts.length = 0;
  mines.length=0;
  powerupTimer = 4; shake = 0;
  aiReset();
  state = 'countdown'; stateTimer = 3; lastCount = 4;
}

function resetMatch() {
  P2.ai = (gameMode === 1);
  P2.name = P2.ai ? '电脑' : '玩家 2';
  P1.score = 0; P2.score = 0; roundNum = 1;
  resetRound();
}

function enterMapSelect() {
  state = 'mapselect';
  bullets.length = 0; particles.length = 0; powerups.length = 0; texts.length = 0; mines.length = 0;
  P1.score = 0; P2.score = 0; roundNum = 1;
}

/* ==================== 电脑 AI（单人模式） ==================== */
var BULLET_SPEED = 580;
var AI = {
  pvx: 0, pvy: 0, lastPX: null, lastPY: null,
  wantAngle: 0, jx: 0, jy: 0, jt: 0,
  strafeDir: 1, strafeT: 0, dirIdx: -1,
  stuckT: 0, lastX: -9999, lastY: -9999,
  mineT: 0
};

function aiReset() {
  AI.pvx = 0; AI.pvy = 0; AI.lastPX = null; AI.lastPY = null;
  AI.wantAngle = 0; AI.jx = 0; AI.jy = 0; AI.jt = 0;
  AI.strafeDir = Math.random() < 0.5 ? 1 : -1; AI.strafeT = 1.5;
  AI.dirIdx = -1; AI.stuckT = 0; AI.lastX = -9999; AI.lastY = -9999;
  AI.mineT = 1.5;
}

// 两点之间是否被墙体挡住（判断有没有射界）
function lineClear(x1, y1, x2, y2) {
  var steps = Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 12);
  for (var i = 1; i < steps; i++) {
    var s = i / steps;
    var x = x1 + (x2 - x1) * s, y = y1 + (y2 - y1) * s;
    for (var j = 0; j < walls.length; j++) {
      var w = walls[j];
      if (x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h) return false;
    }
  }
  return true;
}

// 沿某方向能不能走出一段（预判撞墙）
function canGo(t, dx, dy) {
  for (var s = 1; s <= 4; s++) {
    var x = t.x + dx * s * 15, y = t.y + dy * s * 15;
    if (x < PAD + 15 || x > W - PAD - 15 || y < TOP + 15 || y > H - PAD - 15) return false;
    if (hitsWall(x, y, t.size + 2)) return false;
  }
  return true;
}

// 想走的方向被挡住时，采样一周挑一个"最开阔又最接近目标方向"的方向绕过去
function pickDir(t, wx, wy) {
  var N = 16, best = null, bestScore = -1e9, bestIdx = -1;
  for (var i = 0; i < N; i++) {
    var a = i * Math.PI * 2 / N;
    var cx = Math.cos(a), cy = Math.sin(a);
    var free = 0;
    for (var s = 1; s <= 6; s++) {
      var qx = t.x + cx * s * 15, qy = t.y + cy * s * 15;
      if (qx < PAD + 15 || qx > W - PAD - 15 || qy < TOP + 15 || qy > H - PAD - 15) break;
      if (hitsWall(qx, qy, t.size + 2)) break;
      free = s;
    }
    if (free === 0) continue;
    var score = (cx * wx + cy * wy) * 2.0 + Math.min(free, 6) * 0.6;
    if (free <= 1) score -= 3.0;                // 几乎是死胡同的方向直接重罚
    if (i === AI.dirIdx) score += 0.5;          // 轻微滞回，防止左右反复横跳
    score += Math.random() * 0.12;
    if (score > bestScore) { bestScore = score; best = { x: cx, y: cy }; bestIdx = i; }
  }
  if (best) AI.dirIdx = bestIdx;
  return best;
}

// 电脑决策，返回 { dx, dy, shoot, mine }
function aiThink(t, foe, dt) {
  var cmd = { dx: 0, dy: 0, shoot: false, mine: false };
  if (!foe || !foe.alive || dt <= 0) return cmd;

  // ① 估计对手速度（打提前量用）
  if (AI.lastPX !== null) {
    AI.pvx = AI.pvx * 0.6 + ((foe.x - AI.lastPX) / dt) * 0.4;
    AI.pvy = AI.pvy * 0.6 + ((foe.y - AI.lastPY) / dt) * 0.4;
  }
  AI.lastPX = foe.x; AI.lastPY = foe.y;

  // ② 缓慢游走的瞄准误差，避免"百发百中"
  AI.jt -= dt;
  if (AI.jt <= 0) {
    AI.jt = 0.5 + Math.random() * 0.6;
    AI.jx = (Math.random() - 0.5) * 28;
    AI.jy = (Math.random() - 0.5) * 28;
  }

  // ③ 预判命中点（按子弹飞行时间迭代两次）
  var dist = Math.hypot(foe.x - t.x, foe.y - t.y) || 1;
  var px = foe.x + AI.jx, py = foe.y + AI.jy;
  for (var it = 0; it < 2; it++) {
    var ft = Math.hypot(px - t.x, py - t.y) / BULLET_SPEED;
    px = foe.x + AI.pvx * ft + AI.jx;
    py = foe.y + AI.pvy * ft + AI.jy;
  }
  // 贴脸重叠时方向会抖动，此时沿用上一帧的瞄准角
  if (dist > 25) AI.wantAngle = Math.atan2(py - t.y, px - t.x);
  var ax = Math.cos(AI.wantAngle), ay = Math.sin(AI.wantAngle);
  var faceErr = angDiff(AI.wantAngle, t.angle);
  var clearShot = lineClear(t.x, t.y, px, py);

  // ④ 威胁评估：正在飞向自己的子弹
  var threat = false, threatD = 1e9, dodgeX = 0, dodgeY = 0;
  for (var i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    if (b.owner === t) continue;
    var rx = t.x - b.x, ry = t.y - b.y;
    var bs = Math.hypot(b.vx, b.vy) || 1;
    var ux = b.vx / bs, uy = b.vy / bs;
    var along = rx * ux + ry * uy;       // 子弹飞到自己还要多久的距离
    if (along < 0 || along > 380) continue;
    var side = rx * uy - ry * ux;        // 横向偏移
    if (Math.abs(side) > 46) continue;
    if (along < threatD) {
      threatD = along; threat = true;
      var sg = side >= 0 ? 1 : -1;
      dodgeX = uy * sg; dodgeY = -ux * sg;
    }
  }

  // ⑤ 别踩雷
  var dangerMine = null;
  for (var mi = 0; mi < mines.length; mi++) {
    var m = mines[mi];
    var md = Math.hypot(m.x - t.x, m.y - t.y);
    if (md < 95 && (!dangerMine || md < dangerMine.d)) dangerMine = { m: m, d: md };
  }

  AI.strafeT -= dt;
  if (AI.strafeT <= 0) { AI.strafeDir = -AI.strafeDir; AI.strafeT = 1.4 + Math.random() * 1.2; }

  var mvX = 0, mvY = 0;

  if (threat && threatD < 150) {
    // 紧急闪避：只侧闪，绝不留后撤 —— 边躲边继续往前压
    var dot = dodgeX * ax + dodgeY * ay;
    if (dot > 0.35) { mvX = ax; mvY = ay; }
    else { mvX = dodgeX * 0.75 + ax * 0.65; mvY = dodgeY * 0.75 + ay * 0.65; }
  } else if (dangerMine) {
    // 绕开地雷，但方向仍偏向对手
    var ox = t.x - dangerMine.m.x, oy = t.y - dangerMine.m.y;
    var ol = Math.hypot(ox, oy) || 1;
    mvX = ox / ol + ax * 0.7; mvY = oy / ol + ay * 0.7;
  } else {
    // 道具评估：按"收益 - 距离代价"打分，收益大的（补血/护盾/冻结）愿意跑更远
    var best = null, bestScore = 0;
    for (var q = 0; q < powerups.length; q++) {
      var pu = powerups[q];
      var pd = Math.hypot(pu.x - t.x, pu.y - t.y);
      if (pd > 460) continue;
      var gain = 0;
      if (pu.type === 'heal') gain = t.hp < 85 ? 300 : 50;
      else if (pu.type === 'shield') gain = t.shield > 0 ? 50 : 190;
      else if (pu.type === 'freeze') gain = 200;
      else if (pu.type === 'ap') gain = 200;
      else if (pu.type === 'rapid') gain = t.rapid > 0 ? 60 : 180;
      else if (pu.type === 'triple') gain = t.triple > 0 ? 60 : 180;
      else if (pu.type === 'ricochet') gain = t.ricochet > 0 ? 60 : 150;
      else if (pu.type === 'speed') gain = t.speedUp > 0 ? 50 : 130;
      else if (pu.type === 'minepack') gain = t.mineAmmo > 0 ? 80 : 170;
      var sc = gain - pd * 0.8;
      if (sc > bestScore) { bestScore = sc; best = pu; }
    }
    // 正在交火时只捡"很划算"的，免得为了小道具丢枪口
    var engaged = clearShot && dist < 320;
    if (best && bestScore > (engaged ? 120 : 0)) {
      mvX = best.x - t.x; mvY = best.y - t.y;
    } else if (dist > 25) {
      mvX = ax; mvY = ay;                  // 主行为：一路碾过去打
    } else {
      // 已经贴脸重叠，侧向错开继续缠斗
      mvX = -ay * AI.strafeDir; mvY = ax * AI.strafeDir;
    }
  }

  // ⑥ 落地成实际方向：想去的方向走不通就绕开障碍，绝不顶着墙发呆
  var wl = Math.hypot(mvX, mvY);
  if (wl > 0.001) {
    var wx = mvX / wl, wy = mvY / wl;
    if (canGo(t, wx, wy)) { cmd.dx = wx; cmd.dy = wy; }
    else {
      var alt = pickDir(t, wx, wy);
      if (alt) { cmd.dx = alt.x; cmd.dy = alt.y; }
    }
  }

  // ⑦ 真的被卡死（比如两侧都是墙）时，重新找一个开阔方向脱困
  var moved = Math.hypot(t.x - AI.lastX, t.y - AI.lastY);
  if (wl > 0.001 && moved < 0.6) AI.stuckT += dt; else AI.stuckT = 0;
  AI.lastX = t.x; AI.lastY = t.y;
  if (AI.stuckT > 0.4 && wl > 0.001) {
    AI.dirIdx = -1;
    var esc = pickDir(t, -wx, -wy);
    if (esc) { cmd.dx = esc.x; cmd.dy = esc.y; }
    AI.stuckT = 0;
  }

  // ⑧ 开火：有射界且炮口基本对准才打，不浪费弹药
  cmd.shoot = clearShot && Math.abs(faceErr) < 0.07 && dist < 640;

  // ⑨ 布雷：贴身缠斗时也敢丢雷，逼对手走位
  AI.mineT -= dt;
  if (t.mineAmmo > 0 && AI.mineT <= 0 && dist > 60 && dist < 260) {
    cmd.mine = true;
    AI.mineT = 3.0;
  }
  return cmd;
}

/* ==================== 更新逻辑（已修复卡死） ==================== */
function update(dt) {
  // —— 通用特效更新（所有状态都执行）——
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - dt * 2.2); p.vy *= (1 - dt * 2.2);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (var i2 = texts.length - 1; i2 >= 0; i2--) {
    var tx = texts[i2];
    tx.y -= dt * 34; tx.life -= dt;
    if (tx.life <= 0) texts.splice(i2, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 46);

  // 模式选择 / 选图界面不更新游戏逻辑
  if (state === 'modeselect' || state === 'mapselect') return;
  // 比赛结束只播特效
  if (state === 'matchover') return;

  // —— 倒计时状态 ——
  if (state === 'countdown') {
    stateTimer -= dt;
    var n = Math.ceil(stateTimer);
    if (n !== lastCount) { 
      lastCount = n; 
      if (n > 0) sfx.count(); 
      else sfx.go(); 
    }
    if (stateTimer <= 0) { state = 'playing'; }
    return;
  }

  // —— 回合结束等待 ——
  if (state === 'roundover') {
    stateTimer -= dt;
    if (stateTimer <= 0) { roundNum++; resetRound(); }
    return;
  }

  // —— 游戏进行中完整逻辑 ——
  timeAcc += dt;

  // 地雷更新
  for(var mi=mines.length-1;mi>=0;mi--){
    var m=mines[mi];
    if(!m.armed){
      m.armTimer-=dt;
      if(m.armTimer<=0) m.armed=true;
    }
    for(var ti=0;ti<tanks.length;ti++){
      var tk=tanks[ti];
      if(!tk.alive) continue;
      if(Math.hypot(tk.x-m.x,tk.y-m.y) < tk.size*0.45 + m.r && m.armed){
        explode(m.x,m.y,"#ffbb44");
        sfx.mine();
        damage(tk,35);
        mines.splice(mi,1);
        break;
      }
    }
  }

  // 坦克更新
  for (var k = 0; k < tanks.length; k++) {
    var t = tanks[k];
    if(t.frozen>0){ t.frozen-=dt; continue; }
    if (t.flash > 0) t.flash -= dt;
    if (t.cd > 0) t.cd -= dt;
    if(t.mineCd>0) t.mineCd-=dt;
    if (t.rapid > 0) t.rapid -= dt;
    if (t.triple > 0) t.triple -= dt;
    if (t.speedUp > 0) t.speedUp -= dt;
    if(t.ricochet>0) t.ricochet-=dt;
    if(t.ap>0) t.ap-=dt;

    var dx = 0, dy = 0, shootHeld = false;
    if (t.ai) {
      // 单人模式：玩家 2 交给电脑
      var cmd = aiThink(t, t === P1 ? P2 : P1, dt);
      dx = cmd.dx; dy = cmd.dy; shootHeld = cmd.shoot;
      if (cmd.mine) layMine(t);
    } else {
      if (keys[t.lx]) dx -= 1;
      if (keys[t.rx]) dx += 1;
      if (keys[t.sx]) dy -= 1;
      if (keys[t.sy]) dy += 1;
      for (var s = 0; s < t.shoot.length; s++) if (keys[t.shoot[s]]) shootHeld = true;
    }
    if (dx || dy) {
      var len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      t.angle += angDiff(Math.atan2(dy, dx), t.angle) * Math.min(1, dt * 20);
      var sp = 200 * (t.speedUp > 0 ? 1.55 : 1);
      var nx = t.x + dx * sp * dt;
      var ny = t.y + dy * sp * dt;
      var h = t.size / 2;
      if (!hitsWall(nx, t.y, t.size)) t.x = clamp(nx, PAD + h, W - PAD - h);
      if (!hitsWall(t.x, ny, t.size)) t.y = clamp(ny, TOP + h, H - PAD - h);
    }
    if (shootHeld) fire(t);
    if(!t.ai && keys[t.mineKey]){ layMine(t); keys[t.mineKey]=false; }
  }

  // 子弹更新
  var bi = bullets.length;
  while (bi--) {
    var bu = bullets[bi];
    bu.trail.push({ x: bu.x, y: bu.y });
    if (bu.trail.length > 7) bu.trail.shift();
    bu.x += bu.vx * dt; bu.y += bu.vy * dt;

    if (bu.x < PAD || bu.x > W - PAD || bu.y < TOP || bu.y > H - PAD) { bullets.splice(bi, 1); continue; }
    var hitW = false;
    for (var wi = 0; wi < walls.length; wi++) {
      var w2 = walls[wi];
      if (bu.x > w2.x - bu.r && bu.x < w2.x + w2.w + bu.r && bu.y > w2.y - bu.r && bu.y < w2.y + w2.h + bu.r) {
        hitW = true;
        if(bu.ricochet>0){
          var cx = bu.x - (w2.x + w2.w/2);
          var cy = bu.y - (w2.y + w2.h/2);
          if(Math.abs(cx/w2.w) > Math.abs(cy/w2.h)){ bu.vx = -bu.vx; }
          else { bu.vy = -bu.vy; }
          bu.ricochet -=1;
          spark(bu.x,bu.y,"#ffdd44",7,0.5);
          hitW=false;
        }
        break;
      }
    }
    if (hitW) { spark(bu.x, bu.y, '#9fb4dd', 6, 0.7); bullets.splice(bi, 1); continue; }

    var hitTank = null;
    for (var ti = 0; ti < tanks.length; ti++) {
      var tk = tanks[ti];
      if (tk === bu.owner || !tk.alive) continue;
      if (Math.hypot(tk.x - bu.x, tk.y - bu.y) < tk.size * 0.55 + bu.r) { hitTank = tk; break; }
    }
    if (hitTank) {
      spark(bu.x, bu.y, hitTank.glow, 12, 1);
      damage(hitTank, bu.dmg);
      bullets.splice(bi, 1);
      continue;
    }
    var cancelIdx = -1;
    for (var o = bi - 1; o >= 0; o--) {
      var b2 = bullets[o];
      if (b2.owner === bu.owner) continue;
      if (Math.hypot(b2.x - bu.x, b2.y - bu.y) < b2.r + bu.r + 2) { cancelIdx = o; break; }
    }
    if (cancelIdx >= 0) {
      var b2c = bullets[cancelIdx];
      spark((b2c.x + bu.x) / 2, (b2c.y + bu.y) / 2, '#ffe08a', 12, 1.2);
      bullets.splice(bi, 1);
      bullets.splice(cancelIdx, 1);
      bi = bullets.length;
    }
  }

  // 道具生成拾取
  powerupTimer -= dt;
  if (powerupTimer <= 0 && powerups.length < 3) { spawnPowerup(); powerupTimer = 6.2; }
  for (var pi = powerups.length - 1; pi >= 0; pi--) {
    var pu = powerups[pi];
    pu.t += dt;
    for (var q = 0; q < tanks.length; q++) {
      var tt = tanks[q];
      if (tt.alive && Math.hypot(tt.x - pu.x, tt.y - pu.y) < tt.size * 0.6 + pu.r) {
        applyPowerup(tt, pu);
        powerups.splice(pi, 1);
        break;
      }
    }
  }
}

function spawnPowerup() {
  for (var i = 0; i < 60; i++) {
    var x = PAD + 60 + Math.random() * (W - PAD * 2 - 120);
    var y = TOP + 40 + Math.random() * (H - TOP - PAD - 80);
    if (hitsWall(x, y, 44)) continue;
    var tooClose = false;
    for (var j = 0; j < tanks.length; j++) {
      if (Math.hypot(tanks[j].x - x, tanks[j].y - y) < 110) { tooClose = true; break; }
    }
    if (tooClose) continue;
    var type = puKeys[(Math.random() * puKeys.length) | 0];
    powerups.push({ x: x, y: y, r: 16, type: type, t: Math.random() * 6 });
    return;
  }
}

/* ==================== 绘制 ==================== */
function drawBackground() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#111731');
  g.addColorStop(1, '#0a0e1c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(90,130,220,.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = PAD; x <= W - PAD; x += 40) { ctx.moveTo(x, TOP); ctx.lineTo(x, H - PAD); }
  for (var y = TOP; y <= H - PAD; y += 40) { ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(110,160,255,.28)';
  ctx.lineWidth = 2;
  pathRound(ctx, PAD - 4, TOP - 4, W - PAD * 2 + 8, H - TOP - PAD + 8, 10);
  ctx.stroke();
}

function drawWalls() {
  for (var i = 0; i < walls.length; i++) {
    var w = walls[i];
    var g = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
    g.addColorStop(0, '#3d4a6e');
    g.addColorStop(1, '#232b44');
    pathRound(ctx, w.x, w.y, w.w, w.h, 5);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(150,185,255,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    pathRound(ctx, w.x + 3, w.y + 3, w.w - 6, Math.min(6, w.h - 6), 3);
    ctx.fillStyle = 'rgba(190,215,255,.16)'; ctx.fill();
  }
}

function drawModeSelect() {
  ctx.fillStyle = 'rgba(6,9,18,.95)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#eaf2ff';
  ctx.font = 'bold 54px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillText('双人坦克大战', W / 2, 118);
  ctx.fillStyle = '#7f90b3';
  ctx.font = '18px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillText('按 1 / 2 或 ← → 选择模式，按 Enter 进入选地图', W / 2, 168);

  var cardW = 300, cardH = 230, gap = 48;
  var startX = (W - cardW * 2 - gap) / 2;
  var startY = 236;

  for (var i = 0; i < modes.length; i++) {
    var x = startX + i * (cardW + gap);
    var y = startY;
    var sel = i === currentMode;

    pathRound(ctx, x, y, cardW, cardH, 16);
    ctx.fillStyle = sel ? 'rgba(80,140,255,.18)' : 'rgba(255,255,255,.05)';
    ctx.fill();
    ctx.strokeStyle = sel ? '#5fc8ff' : 'rgba(255,255,255,.15)';
    ctx.lineWidth = sel ? 3 : 1.5;
    ctx.stroke();

    ctx.fillStyle = sel ? '#5fc8ff' : '#8fa0c0';
    ctx.font = 'bold 16px "Segoe UI", sans-serif';
    ctx.fillText('[' + (i + 1) + ']', x + cardW / 2, y + 34);

    ctx.font = '56px "Segoe UI Emoji", "Segoe UI", sans-serif';
    ctx.fillText(modes[i].icon, x + cardW / 2, y + 104);

    ctx.fillStyle = sel ? '#ffffff' : '#cfdcff';
    ctx.font = 'bold 27px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(modes[i].name, x + cardW / 2, y + 162);

    ctx.fillStyle = '#7f90b3';
    ctx.font = '15px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(modes[i].desc, x + cardW / 2, y + 198);
  }

  ctx.fillStyle = '#6a7aa0';
  ctx.font = '15px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillText('4 张地图 · 9 种技能道具 · 先到 ' + WIN_SCORE + ' 分获胜', W / 2, H - 62);
}

function drawMapSelect() {
  ctx.fillStyle = 'rgba(6,9,18,.92)';

  ctx.textAlign = 'center';
  ctx.fillStyle = '#eaf2ff';
  ctx.font = 'bold 52px "Segoe UI", "Microsoft YaHei", sans-serif';

      );

  ctx.font = '15px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillText('先到 ' + WIN_SCORE + ' 分获胜 · 9种技能道具随机掉落', W / 2, H - 50);

function drawPowerups() {
  for (var i = 0; i < powerups.length; i++) {
    var p = powerups[i], d = PU_TYPES[p.type];
    var bob = Math.sin(p.t * 3) * 3;
    var y = p.y + bob;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var rg = ctx.createRadialGradient(p.x, y, 2, p.x, y, p.r * 2.4);
    rg.addColorStop(0, d.color); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(p.x, y, p.r * 2.4, 0, 7); ctx.fillStyle = rg; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(p.x, y, p.r, 0, 7);
    ctx.fillStyle = 'rgba(10,14,26,.92)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = d.color; ctx.stroke();
    ctx.fillStyle = d.color;
    ctx.font = 'bold 19px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d.sym, p.x, y + 1);
  }
}

function drawMines(){
  for(var i=0;i<mines.length;i++){
    var m=mines[i];
    ctx.save();
    ctx.beginPath();
    ctx.arc(m.x,m.y,m.r,0,Math.PI*2);
    ctx.fillStyle=m.armed?"#663322":"#333333";
    ctx.fill();
    ctx.strokeStyle="#ff8844";
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle="#ffdd44";
    ctx.font="bold 16px sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("💣",m.x,m.y);
    ctx.restore();
  }
}

function drawBullets() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    if (b.trail.length > 1) {
      for (var j = 1; j < b.trail.length; j++) {
        ctx.globalAlpha = (j / b.trail.length) * 0.4;
        ctx.strokeStyle = b.color;
        ctx.lineWidth = (j / b.trail.length) * b.r * 1.6;
        ctx.beginPath();
        ctx.moveTo(b.trail[j - 1].x, b.trail[j - 1].y);
        ctx.lineTo(b.trail[j].x, b.trail[j].y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    var rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3.2);
    rg.addColorStop(0, '#ffffff');
    rg.addColorStop(0.35, b.color);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 3.2, 0, 7); ctx.fillStyle = rg; ctx.fill();
  }
  ctx.restore();
}

function drawTank(t) {
  var s = t.size;
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.globalAlpha = t.frozen>0 ? 0.62 : 1;
  ctx.beginPath(); ctx.ellipse(3, 4, s * 0.62, s * 0.5, 0, 0, 7);
  ctx.fillStyle = '#000'; ctx.fill();
  ctx.rotate(t.angle);
  ctx.fillStyle = '#1a2035';
  pathRound(ctx, s * 0.2, -5, s * 0.85, 10, 3); ctx.fill();
  ctx.fillStyle = t.color;
  pathRound(ctx, s * 0.2, -3, s * 0.85, 6, 3); ctx.fill();
  ctx.fillStyle = '#151a2b';
  pathRound(ctx, -s * 0.54, -s * 0.54, s * 1.08, s * 0.2, 3); ctx.fill();
  pathRound(ctx, -s * 0.54, s * 0.34, s * 1.08, s * 0.2, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.lineWidth = 1; ctx.stroke();
  var g = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
  g.addColorStop(0, t.glow);
  g.addColorStop(0.5, t.color);
  g.addColorStop(1, t.color);
  pathRound(ctx, -s / 2, -s / 2, s, s, 8);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, s * 0.27, 0, 7);
  ctx.fillStyle = 'rgba(15,20,35,.75)'; ctx.fill();
  ctx.strokeStyle = t.glow; ctx.lineWidth = 2; ctx.stroke();
  if (t.flash > 0) {
    ctx.globalAlpha = Math.min(0.85, t.flash * 4);
    pathRound(ctx, -s / 2, -s / 2, s, s, 8);
    ctx.fillStyle = '#fff'; ctx.fill();
  }
  ctx.restore();

  if(t.shield>0){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.45+Math.sin(performance.now()/70)*0.22;
    ctx.beginPath();ctx.arc(t.x,t.y,s*1.15,0,Math.PI*2);
    ctx.strokeStyle="#4298ff"; ctx.lineWidth=4; ctx.stroke();
    ctx.restore();
  }
  if(t.frozen>0){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.5;
    ctx.beginPath();ctx.arc(t.x,t.y,s*1.05,0,Math.PI*2);
    ctx.strokeStyle="#80e8ff"; ctx.lineWidth=3; ctx.stroke();
    ctx.restore();
  }
  if (t.speedUp > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 + Math.sin(performance.now() / 80) * 0.2;
    ctx.beginPath(); ctx.arc(t.x, t.y, s * 0.95, 0, 7);
    ctx.strokeStyle = '#59e6ff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
  if (t.rapid > 0 || t.triple > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.45 + Math.sin(performance.now() / 90) * 0.2;
    ctx.beginPath(); ctx.arc(t.x, t.y, s * 0.85, 0, 7);
    ctx.strokeStyle = t.triple > 0 ? '#c07bff' : '#ffb648'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
  var bw = 44, bh = 6, bx = t.x - bw / 2, by = t.y - s * 0.5 - 15;
  ctx.fillStyle = 'rgba(0,0,0,.65)';
  pathRound(ctx, bx - 1, by - 1, bw + 2, bh + 2, 3); ctx.fill();
  var ratio = t.hp / t.maxHp;
  ctx.fillStyle = ratio > 0.5 ? '#4fe08a' : (ratio > 0.25 ? '#ffb648' : '#ff4d5e');
  pathRound(ctx, bx, by, bw * ratio, bh, 3); ctx.fill();
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
    ctx.fillStyle = p.color; ctx.fill();
  }
  ctx.restore();
}

function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i = 0; i < texts.length; i++) {
    var t = texts[i];
    ctx.globalAlpha = Math.max(0, t.life / t.max);
    ctx.font = 'bold 18px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
    ctx.globalAlpha = 1;
  }
}

function drawHud() {
  ctx.fillStyle = '#070a14';
  ctx.fillRect(0, 0, W, TOP - 4);
  ctx.strokeStyle = 'rgba(120,160,255,.18)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, TOP - 4); ctx.lineTo(W, TOP - 4); ctx.stroke();
  drawPlayerHud(P1, false);
  drawPlayerHud(P2, true);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#dfe8ff';
  ctx.font = 'bold 20px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillText('第 ' + roundNum + ' 局 · ' + maps[currentMap].name, W / 2, 22);
  ctx.fillStyle = '#7f90b3';
  ctx.font = '12px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillText('先得 ' + WIN_SCORE + ' 分获胜', W / 2, 44);
}

function drawPlayerHud(t, right) {
  var bw = 300, bh = 16;
  var bx = right ? W - 24 - bw : 24;
  var by = 32;
  var ratio = t.hp / t.maxHp;
  ctx.textAlign = right ? 'right' : 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = t.color;
  ctx.font = 'bold 16px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.fillText(t.name, right ? W - 24 : 24, 18);
  pathRound(ctx, bx, by, bw, bh, 8);
  ctx.fillStyle = 'rgba(255,255,255,.09)'; ctx.fill();
  if (ratio > 0) {
    var g = ctx.createLinearGradient(bx, by, bx + bw * ratio, by);
    g.addColorStop(0, t.glow);
    g.addColorStop(1, t.color);
    pathRound(ctx, bx, by, Math.max(4, bw * ratio), bh, 8);
    ctx.fillStyle = g; ctx.fill();
  }
  pathRound(ctx, bx, by, bw, bh, 8);
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.stroke();
  for (var i = 0; i < WIN_SCORE; i++) {
    var px = right ? (W - 24 - bw - 12 - (i + 1) * 18) : (24 + bw + 12 + i * 18);
    ctx.beginPath();
    ctx.arc(px + 6, 40, 6, 0, 7);
    if (i < t.score) { ctx.fillStyle = t.color; ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.stroke(); }
  }
  var icons = [];
  if (t.rapid > 0) icons.push({ c: '#ffb648', s: '连射 ' + t.rapid.toFixed(1) });
  if (t.triple > 0) icons.push({ c: '#c07bff', s: '散射 ' + t.triple.toFixed(1) });
  if (t.speedUp > 0) icons.push({ c: '#59e6ff', s: '加速 ' + t.speedUp.toFixed(1) });
  if(t.shield>0) icons.push({c:"#4298ff",s:"护盾 挡1次"});
  if(t.ricochet>0) icons.push({c:"#ffdd22",s:"反弹弹 "+t.ricochet.toFixed(1)});
  if(t.ap>0) icons.push({c:"#ff3c28",s:"穿甲 "+t.ap.toFixed(1)});
  if(t.frozen>0) icons.push({c:"#80e8ff",s:"冻结 "+t.frozen.toFixed(1)});
  if(t.mineAmmo>0) icons.push({c:"#9467bd",s:"地雷 x"+t.mineAmmo});

  var ix = right ? W - 24 : 24;
  ctx.font = 'bold 11px "Segoe UI", "Microsoft YaHei", sans-serif';
  for (var k = 0; k < icons.length; k++) {
    var label = icons[k].s;
    var tw = ctx.measureText(label).width + 14;
    var rx = right ? ix - tw : ix;
    pathRound(ctx, rx, 52, tw, 15, 7);
    ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fill();
    ctx.fillStyle = icons[k].c;
    ctx.textAlign = 'center';
    ctx.fillText(label, rx + tw / 2, 60);
    ix += right ? -tw - 6 : tw + 6;
  }
}

function drawOverlay() {
  if (state === 'playing' || state === 'mapselect' || state === 'modeselect') return;
  if (state === 'matchover') {
    ctx.fillStyle = 'rgba(4,6,14,.78)';
    ctx.fillRect(0, 0, W, H);
    var win = P1.score >= WIN_SCORE ? P1 : P2;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.save();
    ctx.shadowColor = win.color; ctx.shadowBlur = 40;
    ctx.fillStyle = win.glow;
    ctx.font = 'bold 62px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(win.name + ' 获胜!', W / 2, H / 2 - 40);
    ctx.restore();
    ctx.fillStyle = '#cfdcff';
    ctx.font = 'bold 28px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(P1.score + ' : ' + P2.score, W / 2, H / 2 + 30);
    ctx.fillStyle = '#8fa0c0';
    ctx.font = '18px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText('按 R 再来一局 · 按 Backspace 重选地图', W / 2, H / 2 + 86);
    return;
  }
  if (state === 'countdown') {
    var n = Math.ceil(stateTimer);
    var frac = 1 - (stateTimer - Math.floor(stateTimer));
    var show = n > 0 ? String(n) : '开始!';
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = Math.max(0, Math.min(1, frac * 1.6));
    var sc = 1 + (1 - frac) * 0.6;
    ctx.translate(W / 2, H / 2);
    ctx.scale(sc, sc);
    ctx.shadowColor = '#6ea8ff'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#eaf2ff';
    ctx.font = 'bold 96px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(show, 0, 0);
    ctx.restore();
    return;
  }
  if (state === 'roundover') {
    ctx.fillStyle = 'rgba(4,6,14,.55)';
    ctx.fillRect(0, 0, W, H);
    var scorer = P1.score > P2.score ? P1 : P2;
    for (var i = 0; i < tanks.length; i++) if (!tanks[i].alive) scorer = tanks[i] === P1 ? P2 : P1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = scorer.glow;
    ctx.font = 'bold 46px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(scorer.name + ' 得分!', W / 2, H / 2);
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (state === 'modeselect') {
    drawBackground();
    drawModeSelect();
    return;
  }

  if (state === 'mapselect') {
    drawBackground();
    drawMapSelect();
    return;
  }

  drawBackground();
  ctx.save();
  if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawWalls();
  drawPowerups();
  drawMines();
  drawBullets();
  for (var i = 0; i < tanks.length; i++) if (tanks[i].alive) drawTank(tanks[i]);
  drawParticles();
  drawTexts();
  ctx.restore();
  drawHud();
  drawOverlay();
}

/* ==================== 按键处理 ==================== */
// 单人/双人模式下底部的操作提示不同
function updateFootHint() {
  var el = document.getElementById('p2hint');
  if (!el) return;
  if (gameMode === 1) {
    el.innerHTML = '<span class="p2">电脑 AI</span> 自动作战 · 你只需控制玩家 1';
  } else {
    el.innerHTML = '<span class="p2">玩家 2</span> <span class="k">↑</span><span class="k">←</span><span class="k">↓</span><span class="k">→</span>移动 · <span class="k">回车</span>开火 · <span class="k">/</span>放地雷';
  }
}

window.addEventListener('keydown', function (e) {
  var c = e.code;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter','NumpadEnter','Slash','KeyQ'].indexOf(c) >= 0) e.preventDefault();
  initAudio();
  keys[c] = true;

  // 模式选择界面按键
  if (state === 'modeselect') {
    if (c === 'Digit1') { currentMode = 0; sfx.select(); }
    if (c === 'Digit2') { currentMode = 1; sfx.select(); }
    if (c === 'ArrowLeft' || c === 'ArrowRight') { currentMode = 1 - currentMode; sfx.select(); }
    if (c === 'Enter' || c === 'NumpadEnter') {
      gameMode = modes[currentMode].id;
      state = 'mapselect';
      updateFootHint();
      sfx.confirm();
    }
    return;
  }

  // 地图选择界面按键
  if (state === 'mapselect') {
    if (c === 'Digit1') { currentMap = 0; sfx.select(); }
    if (c === 'Digit2') { currentMap = 1; sfx.select(); }
    if (c === 'Digit3') { currentMap = 2; sfx.select(); }
    if (c === 'Digit4') { currentMap = 3; sfx.select(); }
    if (c === 'Enter' || c === 'NumpadEnter') {
      loadMap(currentMap);
      resetMatch();
      sfx.confirm();
    }
    if (c === 'Backspace') {
      currentMode = gameMode === 1 ? 1 : 0;
      state = 'modeselect';
      sfx.select();
    }
    return;
  }

  if (c === 'KeyM') { soundOn = !soundOn; }
  if (c === 'KeyR') {
    if (state === 'matchover') resetMatch();
    else resetRound();
  }
  if (c === 'Backspace') {
    enterMapSelect();
    sfx.select();
  }
}, { passive: false });

window.addEventListener('keyup', function (e) { keys[e.code] = false; });
window.addEventListener('blur', function () { keys = {}; });
window.addEventListener('mousedown', initAudio);

/* ==================== 鼠标支持：单击高亮 / 双击打开 ==================== */
function canvasPos(e) {
  var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
function cardLayout(type, i) {
  if (type === 'mode') {
    var cardW = 300, cardH = 230, gap = 48;
    return { x: (W - cardW * 2 - gap) / 2 + i * (cardW + gap), y: 236, w: cardW, h: cardH };
  }
  var cardW = 200, cardH = 260;
  return { x: (W - cardW * 4 - 30 * 3) / 2 + i * (cardW + 30), y: 210, w: cardW, h: cardH };
}
function hitCard(type, px, py) {
  var n = type === 'mode' ? modes.length : maps.length;
  for (var i = 0; i < n; i++) {
    var c = cardLayout(type, i);
    if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) return i;
  }
  return -1;
}

// 单击：高亮选中卡片
window.addEventListener('click', function (e) {
  initAudio();
  var p = canvasPos(e);
  if (state === 'modeselect') {
    var m = hitCard('mode', p.x, p.y);
    if (m >= 0) { currentMode = m; sfx.select(); }
    return;
  }
  if (state === 'mapselect') {
    var mm = hitCard('map', p.x, p.y);
    if (mm >= 0) { currentMap = mm; sfx.select(); }
  }
});

// 双击：选中并直接打开下一界面
window.addEventListener('dblclick', function (e) {
  initAudio();
  var p = canvasPos(e);
  if (state === 'modeselect') {
    var m = hitCard('mode', p.x, p.y);
    if (m >= 0) {
      currentMode = m;
      gameMode = modes[m].id;
      state = 'mapselect';
      updateFootHint();
      sfx.confirm();
    }
    return;
  }
  if (state === 'mapselect') {
    var mm = hitCard('map', p.x, p.y);
    if (mm >= 0) {
      currentMap = mm;
      loadMap(mm);
      resetMatch();
      sfx.confirm();
    }
  }
});

/* ==================== 主循环 ==================== */
var last = performance.now();
function loop(now) {
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
